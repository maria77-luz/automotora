<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar vehículo | AUTOMOTORA</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f2f4f7;
        margin: 0;
      }

      header {
        background: #172b4d;
        color: white;
        text-align: center;
        padding: 25px;
      }

      main {
        max-width: 600px;
        margin: 30px auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
      }

      label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        box-sizing: border-box;
      }

      input[type="checkbox"] {
        width: auto;
      }

      button {
        background: #16834a;
        color: white;
        border: none;
        padding: 12px 20px;
        margin-top: 20px;
        cursor: pointer;
      }

      .error {
        color: #b42318;
        background: #fee4e2;
        padding: 10px;
        border-radius: 6px;
      }

      a {
        color: #172b4d;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>AUTOMOTORA</h1>
      <p>Editar vehículo</p>
    </header>

    <main>
      <h2>Editar vehículo</h2>

      {% if error %}
      <p class="error">{{ error }}</p>
      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <label>Marca:</label>
        <input type="text" name="marca" value="{{ vehiculo.marca }}" required />

        <label>Modelo:</label>
        <input
          type="text"
          name="modelo"
          value="{{ vehiculo.modelo }}"
          required
        />

        <label>Año:</label>
        <input type="number" name="anio" value="{{ vehiculo.anio }}" required />

        <label>Precio:</label>
        <input
          type="number"
          name="precio"
          value="{{ vehiculo.precio }}"
          required
        />

        <label>Kilometraje:</label>
        <input
          type="number"
          name="kilometraje"
          value="{{ vehiculo.kilometraje }}"
          required
        />

        <label>Descripción:</label>
        <textarea name="descripcion">{{ vehiculo.descripcion }}</textarea>

        <label>URL de la imagen (opcional):</label>
        <input
          type="url"
          name="imagen_url"
          value="{{ vehiculo.imagen_url }}"
          placeholder="https://..."
        />

        <!-- prettier-ignore -->
        <label><input type="checkbox" name="disponible" {% if vehiculo.disponible %}checked{% endif %}> Disponible</label>

        <button type="submit">Guardar cambios</button>
      </form>

      <p><a href="{% url 'lista_vehiculos' %}">Volver a vehículos</a></p>
    </main>
  </body>
</html>
