<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eliminar vehículo | Automotora</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f4f8;
        color: #24344d;
      }

      header {
        background: #101d35;
        color: white;
        text-align: center;
        padding: 25px;
      }

      nav {
        background: #243b5a;
        padding: 16px;
        text-align: center;
      }

      nav a {
        color: white;
        text-decoration: none;
        margin: 0 12px;
        font-weight: bold;
      }

      .contenedor {
        max-width: 550px;
        margin: 60px auto;
        padding: 35px;
        background: white;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      h2 {
        color: #101d35;
      }

      .vehiculo {
        padding: 15px;
        margin: 20px 0;
        background: #f2f4f8;
        border-radius: 8px;
        font-size: 20px;
        font-weight: bold;
      }

      .botones {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 25px;
      }

      button,
      .cancelar {
        padding: 13px 20px;
        border: none;
        border-radius: 7px;
        font-weight: bold;
        text-decoration: none;
        cursor: pointer;
      }

      button {
        background: #b42318;
        color: white;
      }

      .cancelar {
        background: #d6aa55;
        color: #101d35;
      }

      footer {
        text-align: center;
        padding: 20px;
        color: #667085;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Automotora</h1>
      <p>Gestión de vehículos</p>
    </header>

    <nav>
      <a href="{% url 'inicio' %}">Inicio</a>
      <a href="{% url 'lista_vehiculos' %}">Vehículos</a>
      <a href="{% url 'crear_vehiculo' %}">Agregar vehículo</a>
    </nav>

    <main class="contenedor">
      <h2>Eliminar vehículo</h2>

      <p>¿Estás seguro de que deseas eliminar este vehículo?</p>

      <div class="vehiculo">{{ vehiculo.marca }} {{ vehiculo.modelo }}</div>

      <p>Esta acción no se puede deshacer.</p>

      <div class="botones">
        <form
          method="POST"
          onsubmit="
            return confirm('¿Confirmas que deseas eliminar este vehículo?');
          "
        >
          {% csrf_token %}
          <button type="submit">Sí, eliminar</button>
        </form>

        <a href="{% url 'lista_vehiculos' %}" class="cancelar"> Cancelar </a>
      </div>
    </main>

    <footer>
      <p>Automotora - Sistema de gestión de vehículos</p>
    </footer>
  </body>
</html>
